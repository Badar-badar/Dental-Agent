services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/dental
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - mongo
      - chroma

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo_data:
  chroma_data:
